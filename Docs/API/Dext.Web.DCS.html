<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dext.Web.DCS - Dext Framework 1.0</title>
    
    <!-- Blocking script to avoid theme flicker --> 
    <script>
        (function() {
            const storedTheme = localStorage.getItem('dext-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', storedTheme);
        })();
    </script>
    
    <!-- Theme & Layout (Separate files for internal Dext Tooling) -->
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="layout.css">
    
    <!-- Mermaid for Diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>Dext Framework 1.0</h3>
            <small>Documentation</small>
        </div>
        <div class="search-box">
            <input type="text" class="search-input" placeholder="Search API..." id="searchInput">
        </div>
        <div class="nav-list" id="navList">
            <!-- Sidebar Content Loaded Dynamically via toc.json -->
        </div>
    </div>

    <div class="main-content">
        <div class="header-actions">
            <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode">&#x1F313;</button>
        </div>
        
        <div id="contentArea">
            <!-- Main Documentation Content Injected Here -->
            <h1>Unit Dext.Web.DCS</h1>
        </div>
    </div>

    <script src="toc.js"></script>
    <script src="viewer.js"></script>
</body>
</html>
